<head>

<meta property="og:description" content="L'actualité du Sud-Kivu autrement. Articles vérifiés, de terrain. Bukavu, Sud-Kivu, RDC.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://enecrdc.github.io/enecrdc-info/">
<meta property="og:image" content="https://enecrdc.github.io/enecrdc-info/Logo.jpg">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#F4F5F7}
header{background:#0A1F3D;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
header strong{font-size:20px}header strong span{color:#C9A227}
header a{color:#fff;text-decoration:none}
.flash{background:#D32F2F;color:#fff;padding:10px 16px;font-weight:700;font-size:14px}
.wrap{max-width:800px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:12px;overflow:hidden}
.card img{width:100%;max-height:360px;object-fit:cover;display:block}
.body{padding:20px}.badge{background:#C9A227;color:#0A1F3D;font-size:11px;font-weight:700;padding:4px 8px;border-radius:20px}
h1{font-size:26px;line-height:1.3}.card p{line-height:1.7;color:#333;white-space:pre-line}
.share{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.share button, .share a{padding:10px 14px;border-radius:20px;border:none;font-weight:700;cursor:pointer;text-decoration:none;font-size:14px}
.btn-copy{background:#0A1F3D;color:#fff}.btn-wa{background:#25D366;color:#fff}.btn-fb{background:#1877F2;color:#fff}
footer{background:#0A1F3D;color:#fff;padding:20px;text-align:center;margin-top:20px}
</style>
</head>
<body>
<header><strong>ENEC<span>RDC</span>.INFO</strong><a href="index.html">← Accueil</a></header>
<div class="flash">FLASH • Info en continu — RDC • Sud-Kivu • Bukavu</div>
<div class="wrap"><div id="content">Chargement de l'article...</div></div>
<footer>© 2026 ENECRDC.INFO - Bukavu, Sud-Kivu, RDC</footer>
<script>
const SUPABASE_URL = "https://vxcqmskiaxttipmiccku.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ4Y3Ftc2tpYXh0dGlwbWljY2t1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0MTk3MTAsImV4cCI6MjEwOTk5NTcxMH0.Pf3LYtl2VAfd-Lk97WeAxL1S5Vgg50Daj08nAp4hOjo";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
async function load(){
  const slug = new URLSearchParams(window.location.search).get('slug');
  const el = document.getElementById('content');
  if(!slug){ el.innerHTML = '<p>Article introuvable. <a href="index.html">Retour à l\'accueil</a></p>'; return; }
  const {data, error} = await client.from('articles').select('title,excerpt,content,cover_image_url,created_at,slug,category:categories(name)').eq('slug', slug).eq('status','publie').single();
  if(error || !data){ el.innerHTML = '<p>Article introuvable ou pas encore publié. <a href="index.html">Retour à l\'accueil</a></p>'; return; }
  document.title = data.title + ' - ENECRDC.INFO';
  const link = window.location.href;
  const wa = 'https://wa.me/?text=' + encodeURIComponent(data.title + ' - ENECRDC.INFO ' + link);
  const fb = 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(link);
  el.innerHTML = '<div class="card">' + (data.cover_image_url ? '<img src="'+data.cover_image_url+'">' : '') + '<div class="body"><span class="badge">'+(data.category ? data.category.name.toUpperCase() : 'À LA UNE')+'</span><h1>'+data.title+'</h1><p><small>Publié le '+new Date(data.created_at).toLocaleDateString('fr-FR')+' • Bukavu, Sud-Kivu</small></p><p><strong>'+(data.excerpt||'')+'</strong></p><p>'+data.content+'</p><div class="share"><button class="btn-copy" onclick="navigator.clipboard.writeText(\''+link+'\');alert(\'✅ Lien copié ! Collez-le sur WhatsApp / Facebook\')">📋 Copier le lien</button><a class="btn-wa" href="'+wa+'" target="_blank">WhatsApp</a><a class="btn-fb" href="'+fb+'" target="_blank">Facebook</a></div></div></div>';
}
load();
</script>
</body>
</html>
