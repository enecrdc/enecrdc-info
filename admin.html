<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - ENECRDC.INFO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;background:#F4F5F7;margin:0;padding:16px}
.top{background:#0A1F3D;color:#fff;padding:16px;border-radius:12px;display:flex;justify-content:space-between;align-items:center}
.top span{color:#C9A227}
.box{background:#fff;padding:16px;border-radius:12px;margin-top:12px}
input,textarea,select{width:100%;padding:12px;border-radius:8px;border:1px solid #ddd;margin:8px 0;box-sizing:border-box}
button{background:#0A1F3D;color:#fff;padding:10px 12px;border-radius:8px;font-weight:700;border:none;cursor:pointer}
.btn-small{padding:6px 10px;font-size:12px;margin:4px 4px 0 0}
.btn-gold{background:#C9A227;color:#0A1F3D}.btn-green{background:#25D366;color:#fff}.btn-orange{background:#FF9800;color:#fff}
#msg{font-size:13px;background:#F4F5F7;padding:10px;border-radius:8px;display:none}
label{font-size:13px;font-weight:700}
img.preview{width:100%;border-radius:8px;margin-top:8px;display:none}
.article{border:1px solid #eee;border-radius:10px;padding:12px;margin-bottom:12px}
.link{font-size:12px;word-break:break-all;background:#F4F5F7;padding:8px;border-radius:8px;margin-top:8px}
</style>
</head>
<body>
<div class="top"><div><strong>ENEC<span>RDC</span>.INFO</strong> - Espace Admin</div><button onclick="logout()" style="background:#C9A227;color:#0A1F3D;">Déconnexion</button></div>
<div class="box"><h2 id="welcome">Chargement...</h2><p id="role"></p></div>
<div class="box"><h3 id="formTitle">Nouvel article</h3><form id="f">
<label>Titre</label><input id="title" required placeholder="Titre de l'article">
<label>Catégorie</label><select id="category"><option value="">Chargement des catégories...</option></select>
<label>Photo de couverture (laissez vide pour garder l'ancienne)</label><input type="file" id="photo" accept="image/*"><img id="preview" class="preview">
<label>Résumé</label><textarea id="excerpt" rows="2" placeholder="Résumé en 2-3 lignes"></textarea>
<label>Contenu</label><textarea id="content" rows="6" required placeholder="Votre article complet ici..."></textarea>
<button type="submit" id="btn">Enregistrer en brouillon</button><button type="button" id="cancelEdit" onclick="cancelEdit()" style="display:none;background:#888;">Annuler la modification</button><p id="msg"></p></form></div>
<div class="box"><h3>Mes articles — Modifier / Partager</h3><div id="list">Chargement...</div></div>
<script>
const SUPABASE_URL = "https://vxcqmskiaxttipmiccku.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ4Y3Ftc2tpYXh0dGlwbWljY2t1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0MTk3MTAsImV4cCI6MjEwOTk5NTcxMH0.Pf3LYtl2VAfd-Lk97WeAxL1S5Vgg50Daj08nAp4hOjo";
const SITE = "https://enecrdc.github.io/enecrdc-info";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let editingSlug = null;
document.getElementById('photo').addEventListener('change', (e) => {
  const f = e.target.files[0]; if(!f) return;
  const img = document.getElementById('preview'); img.src = URL.createObjectURL(f); img.style.display = 'block';
});
async function loadCategories(){
  const {data} = await client.from('categories').select('id,name,slug').order('name');
  const sel = document.getElementById('category');
  if(!data || !data.length){ sel.innerHTML = '<option value="">Aucune catégorie</option>'; return; }
  sel.innerHTML = data.map(c => '<option value="'+c.id+'">'+c.name+'</option>').join('');
}
async function check(){
  const {data:{user}} = await client.auth.getUser();
  if(!user){ window.location.href='login.html'; return; }
  const {data:profile} = await client.from('profiles').select('full_name,role').eq('id',user.id).single();
  document.getElementById('welcome').textContent = 'Bienvenue ' + (profile ? profile.full_name : user.email);
  document.getElementById('role').textContent = 'Rôle : ' + (profile ? profile.role : '-');
  loadCategories(); loadArticles(user.id);
}
function getLink(slug){ return SITE + '/article.html?slug=' + slug; }
function copyLink(slug){ navigator.clipboard.writeText(getLink(slug)).then(()=>{ alert('✅ Lien copié !\n\n' + getLink(slug)); }); }
async function editArticle(slug){
  const {data} = await client.from('articles').select('*').eq('slug', slug).single();
  if(!data){ alert('Article introuvable'); return; }
  editingSlug = slug;
  document.getElementById('title').value = data.title || '';
  document.getElementById('excerpt').value = data.excerpt || '';
  document.getElementById('content').value = data.content || '';
  if(data.category_id) document.getElementById('category').value = data.category_id;
  if(data.cover_image_url){ const img = document.getElementById('preview'); img.src = data.cover_image_url; img.style.display = 'block'; }
  document.getElementById('formTitle').textContent = 'Modifier l\'article : ' + data.title;
  document.getElementById('btn').textContent = 'Mettre à jour l\'article';
  document.getElementById('cancelEdit').style.display = 'inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
  alert('Article chargé dans le formulaire en haut. Corrigez, puis appuyez sur Mettre à jour.');
}
function cancelEdit(){
  editingSlug = null;
  document.getElementById('f').reset();
  document.getElementById('preview').style.display = 'none';
  document.getElementById('formTitle').textContent = 'Nouvel article';
  document.getElementById('btn').textContent = 'Enregistrer en brouillon';
  document.getElementById('cancelEdit').style.display = 'none';
}
async function loadArticles(uid){
  const {data} = await client.from('articles').select('title,slug,status,created_at,cover_image_url,category:categories(name)').eq('author_id',uid).order('created_at',{ascending:false}).limit(20);
  const el = document.getElementById('list');
  if(!data || !data.length){ el.innerHTML = 'Aucun article pour le moment.'; return; }
  el.innerHTML = data.map(a => {
    const link = getLink(a.slug);
    const wa = 'https://wa.me/?text=' + encodeURIComponent(a.title + ' - ENECRDC.INFO ' + link);
    return '<div class="article"><strong>' + a.title + '</strong><br><small>' + (a.category ? a.category.name : 'Sans catégorie') + ' - ' + a.status + ' ' + (a.cover_image_url ? '📷' : '') + ' - ' + new Date(a.created_at).toLocaleDateString('fr-FR') + '</small><div class="link">' + link + '</div><button class="btn-small btn-orange" onclick="editArticle(\''+a.slug+'\')">✏️ Modifier</button><button class="btn-small btn-gold" onclick="copyLink(\''+a.slug+'\')">📋 Copier le lien</button><button class="btn-small" onclick="window.open(\''+link+'\',\'_blank\')">👁️ Voir</button><a href="'+wa+'" target="_blank"><button class="btn-small btn-green" type="button">WhatsApp</button></a>' + (a.status !== 'publie' ? '<button class="btn-small" onclick="publishArticle(\''+a.title.replace(/\'/g,"\\'")+'\')">Publier</button>' : '') + '</div>';
  }).join('');
}
async function publishArticle(title){
  const {error} = await client.from('articles').update({status:'publie', published_at: new Date().toISOString()}).ilike('title', title);
  if(error){ alert('Erreur : '+error.message); } else { alert('✅ Article publié !'); location.reload(); }
}
async function logout(){ await client.auth.signOut(); window.location.href='login.html'; }
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const {data:{user}} = await client.auth.getUser(); if(!user) return;
  const msg = document.getElementById('msg'); msg.style.display='block'; msg.textContent = 'Enregistrement...';
  const title = document.getElementById('title').value;
  const excerpt = document.getElementById('excerpt').value;
  const content = document.getElementById('content').value;
  const category_id = document.getElementById('category').value || null;
  let cover_image_url = null;
  const file = document.getElementById('photo').files[0];
  if(file){
    const fileName = Date.now() + '-' + file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    const {error: upErr} = await client.storage.from('media').upload(fileName, file);
    if(!upErr){ const {data: pub} = client.storage.from('media').getPublicUrl(fileName); cover_image_url = pub.publicUrl; }
  }
  if(editingSlug){
    const update = {title, excerpt, content, category_id};
    if(cover_image_url) update.cover_image_url = cover_image_url;
    const {error} = await client.from('articles').update(update).eq('slug', editingSlug);
    if(error){ msg.textContent = 'Erreur : ' + error.message; } else { msg.textContent = '✅ Article mis à jour ! (même s\'il était déjà publié, la correction est en ligne)'; cancelEdit(); loadArticles(user.id); }
  } else {
    const slug = title.toLowerCase().replace(/[^a-z0-9à-ÿ]+/gi,'-').replace(/^-|-$/g,'') + '-' + Date.now().toString().slice(-5);
    const {error} = await client.from('articles').insert({title, slug, excerpt, content, author_id: user.id, category_id, cover_image_url, status:'brouillon'});
    if(error){ msg.textContent = 'Erreur : ' + error.message; } else { msg.textContent = '✅ Article créé en BROUILLON.'; document.getElementById('f').reset(); document.getElementById('preview').style.display='none'; loadArticles(user.id); }
  }
});
check();
</script>
</body>
</html>
