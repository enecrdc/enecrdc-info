<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin TEST - ENECRDC.INFO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{font-family:Arial;padding:16px;background:#F4F5F7}button{background:#0A1F3D;color:#fff;padding:10px 14px;border-radius:8px;border:none;font-weight:700}.box{background:#fff;padding:16px;border-radius:12px;margin-top:12px}</style>
</head>
<body>
<h2>TEST ADMIN</h2>
<div class="box"><p id="status">Test de connexion...</p><button onclick="localStorage.clear();sessionStorage.clear();location.href='login.html?v=99'">Se reconnecter</button></div>
<div class="box"><h3>Mes articles (sans catégorie)</h3><div id="list">Chargement...</div></div>
<script>
const SUPABASE_URL = "https://vxcqmskiaxttipmiccku.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ4Y3Ftc2tpYXh0dGlwbWljY2t1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0MTk3MTAsImV4cCI6MjEwOTk5NTcxMH0.Pf3LYtl2VAfd-Lk97WeAxL1S5Vgg50Daj08nAp4hOjo";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
async function test(){
  const s = document.getElementById('status');
  try{
    const {data:{user}, error:uErr} = await client.auth.getUser();
    if(uErr){ s.textContent = 'Erreur auth : ' + uErr.message; return; }
    if(!user){ s.textContent = 'Pas connecté. Allez sur login.html'; location.href='login.html?v=99'; return; }
    s.textContent = 'Connecté : ' + user.email;
    const {data, error} = await client.from('articles').select('title,slug,status,created_at').eq('author_id', user.id).order('created_at',{ascending:false}).limit(20);
    if(error){ document.getElementById('list').textContent = 'Erreur articles : ' + error.message; return; }
    if(!data.length){ document.getElementById('list').textContent = 'Aucun article trouvé.'; return; }
    document.getElementById('list').innerHTML = data.map(a=>'<p>• '+a.title+' — '+a.status+'</p>').join('');
  }catch(e){ document.getElementById('status').textContent = 'Erreur : ' + e.message; }
}
test();
</script>
</body>
</html>
